<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Estado de Habitaciones</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<h2>Estado de Habitaciones</h2>

<table border="1">
    <thead>
        <tr>
            <th>Número</th>
            <th>Tipo</th>
            <th>Estado</th>
            <th>Precio</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="h : ${habitaciones}">
            <td th:text="${h.numero}"></td>
            <td th:text="${h.tipo}"></td>
            <td th:text="${h.estado}"></td>
            <td th:text="${h.precioNoche}"></td>

            <td>
                <!-- CHECK-IN: SOLO SI ESTÁ DISPONIBLE -->
                <form th:if="${h.estado.name() == 'DISPONIBLE'}"
                      th:action="@{/checkin}"
                      method="post"
                      style="display:inline">

                    <input type="hidden" name="habitacionId" th:value="${h.id}">
                    <button type="submit">Check-In</button>
                </form>

<td>
    <!-- CHECK-IN -->
    <form th:if="${h.estado.name() == 'DISPONIBLE'}"
          th:action="@{/checkin}"
          method="post"
          style="display:inline">

        <input type="hidden" name="habitacionId" th:value="${h.id}">
        <button type="submit">Check-In</button>
    </form>

    <!-- CHECK-OUT -->
    <form th:if="${h.estado.name() == 'OCUPADA'}"
          th:action="@{/checkout}"
          method="post"
          style="display:inline">

        <input type="hidden" name="habitacionId" th:value="${h.id}">
        <button type="submit">Check-Out</button>
    </form>

    <!-- OTROS ESTADOS -->
    <span th:if="${h.estado.name() == 'LIMPIEZA' || h.estado.name() == 'MANTENIMIENTO'}">
        —
    </span>
</td>



                <!-- MENSAJE CUANDO NO ESTÁ DISPONIBLE -->
                <span th:if="${h.estado.name() != 'DISPONIBLE'}">
                    —
                </span>
                <!-- MARCAR COMO LIMPIA -->
<form th:if="${h.estado.name() == 'LIMPIEZA'}"
      th:action="@{/habitaciones/limpia}"
      method="post"
      style="display:inline">

    <input type="hidden" name="id" th:value="${h.id}">
    <button type="submit">Marcar como limpia</button>
</form>

            </td>
        </tr>
    </tbody>
</table>

<br>
<a href="/dashboard">← Volver</a>

</body>
</html>
