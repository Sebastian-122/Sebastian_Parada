<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Estado de Habitaciones</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<h2>Estado de Habitaciones</h2>

<table border="1">
    <thead>
        <tr>
            <th>Número</th>
            <th>Tipo</th>
            <th>Estado</th>
            <th>Precio</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="h : ${habitaciones}">
            <td th:text="${h.numero}"></td>
            <td th:text="${h.tipo}"></td>

            <!-- ESTADO (luego lo pintas con CSS) -->
            <td th:text="${h.estado}"
                th:class="'estado-' + ${h.estado}">
            </td>

            <td th:text="${h.precioNoche}"></td>

            <td>

                <!-- CHECK-IN (DISPONIBLE) -->
                <form th:if="${h.estado.name() == 'DISPONIBLE'}"
                      th:action="@{/checkin}"
                      method="post"
                      style="display:inline">

                    <input type="hidden" name="habitacionId" th:value="${h.id}">
                    <button type="submit">Check-In</button>
                </form>

                <!-- CHECK-OUT (OCUPADA) -->
                <form th:if="${h.estado.name() == 'OCUPADA'}"
                      th:action="@{/checkout}"
                      method="post"
                      style="display:inline">

                    <input type="hidden" name="habitacionId" th:value="${h.id}">
                    <button type="submit">Check-Out</button>
                </form>

                <!-- LIMPIEZA -->
                <form th:if="${h.estado.name() == 'LIMPIEZA'}"
                      th:action="@{/habitaciones/limpia}"
                      method="post"
                      style="display:inline">

                    <input type="hidden" name="id" th:value="${h.id}">
                    <button type="submit">Marcar Disponible</button>
                </form>

                <form th:if="${h.estado.name() == 'LIMPIEZA'}"
                      th:action="@{/habitaciones/mantenimiento}"
                      method="post"
                      style="display:inline">

                    <input type="hidden" name="id" th:value="${h.id}">
                    <button type="submit">Enviar a Mantenimiento</button>
                </form>

                <!-- MANTENIMIENTO -->
                <form th:if="${h.estado.name() == 'MANTENIMIENTO'}"
                      th:action="@{/habitaciones/reparada}"
                      method="post"
                      style="display:inline">

                    <input type="hidden" name="id" th:value="${h.id}">
                    <button type="submit">Reparada</button>
                </form>

                <!-- CUANDO NO HAY ACCIONES -->
                <span th:if="${h.estado.name() != 'DISPONIBLE'
                              and h.estado.name() != 'OCUPADA'
                              and h.estado.name() != 'LIMPIEZA'
                              and h.estado.name() != 'MANTENIMIENTO'}">
                    —
                </span>

            </td>
        </tr>
    </tbody>
</table>

<br>
<a th:href="@{/dashboard}">← Volver</a>

</body>
</html>
